name: Build Windows Application

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Run Test Suite
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: |
          python -m pytest -v

  build-windows:
    name: Package Windows Executable & Installer
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm --onedir --windowed ^
            --name "StockACBPortfolioTracker" ^
            --version-file "file_version_info.txt" ^
            --collect-submodules "portfolio_tracker" ^
            --collect-data "PySide6" ^
            --hidden-import "PySide6.QtCharts" ^
            --hidden-import "openpyxl" ^
            --hidden-import "pandas" ^
            portfolio_tracker\main.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Setup Wizard
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" installer.iss
          } else {
            iscc installer.iss
          }

      - name: Upload Setup Wizard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockACBPortfolioTracker-Windows-Setup
          path: installer_output/StockACBPortfolioTrackerSetup.exe
          if-no-files-found: error

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/StockACBPortfolioTrackerSetup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
