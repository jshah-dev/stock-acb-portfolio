name: Build Windows Application

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  build-windows:
    name: Package Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Application Bundle & Portable Exe)
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "StockACBPortfolioTracker" `
            --add-data "portfolio_tracker/ui;portfolio_tracker/ui" `
            --hidden-import "openpyxl" `
            --hidden-import "pandas" `
            --hidden-import "plotly" `
            --hidden-import "PySide6.QtWebEngineWidgets" `
            --hidden-import "PySide6.QtWebEngineCore" `
            portfolio_tracker/main.py

          pyinstaller --noconfirm --onefile --windowed `
            --name "StockACBPortfolioTrackerPortable" `
            --add-data "portfolio_tracker/ui;portfolio_tracker/ui" `
            --hidden-import "openpyxl" `
            --hidden-import "pandas" `
            --hidden-import "plotly" `
            --hidden-import "PySide6.QtWebEngineWidgets" `
            --hidden-import "PySide6.QtWebEngineCore" `
            portfolio_tracker/main.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Setup Wizard
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Setup Wizard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockACBPortfolioTracker-Setup-Wizard
          path: installer_output/StockACBPortfolioTrackerSetup.exe
          if-no-files-found: error

      - name: Upload Portable Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockACBPortfolioTracker-Portable-Exe
          path: dist/StockACBPortfolioTrackerPortable.exe
          if-no-files-found: error

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/StockACBPortfolioTrackerSetup.exe
            dist/StockACBPortfolioTrackerPortable.exe
          draft: false
          prerelease: false
          generate_release_notes: true

